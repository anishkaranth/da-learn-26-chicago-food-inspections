<svg xmlns="http://www.w3.org/2000/svg" width="700" height="292" viewBox="0 0 700 292" font-family="Helvetica,Arial,sans-serif"><rect width="700" height="292" fill="#fff"/><text x="12" y="22" font-size="14" text-anchor="start" fill="#222" font-weight="bold">Violation themes: % of passed vs failed inspections citing them (2018 form)</text><text x="12" y="39" font-size="10" text-anchor="start" fill="#777">Jul 2018 - Oct 2026; x = how many times more common in failed inspections</text><line x1="208" y1="52" x2="208" y2="258" stroke="#eee"/><text x="208" y="270" font-size="9" text-anchor="middle" fill="#777">0%</text><line x1="294" y1="52" x2="294" y2="258" stroke="#eee"/><text x="294" y="270" font-size="9" text-anchor="middle" fill="#777">25%</text><line x1="379" y1="52" x2="379" y2="258" stroke="#eee"/><text x="379" y="270" font-size="9" text-anchor="middle" fill="#777">50%</text><line x1="464" y1="52" x2="464" y2="258" stroke="#eee"/><text x="464" y="270" font-size="9" text-anchor="middle" fill="#777">75%</text><line x1="550" y1="52" x2="550" y2="258" stroke="#eee"/><text x="550" y="270" font-size="9" text-anchor="middle" fill="#777">100%</text><text x="202" y="67" font-size="10" text-anchor="end" fill="#333">Physical facilities &amp; maintenance</text><line x1="384.3" y1="63.4" x2="461.9" y2="63.4" stroke="#bbb" stroke-width="3"/><circle cx="384.3" cy="63.4" r="5" fill="#2a9d8f"/><circle cx="461.9" cy="63.4" r="5" fill="#d1495b"/><text x="470" y="67" font-size="8" text-anchor="start" fill="#444">74%</text><text x="376" y="67" font-size="8" text-anchor="end" fill="#444">52%</text><text x="590" y="67" font-size="9" text-anchor="start" fill="#555">x1.4</text><text x="202" y="90" font-size="10" text-anchor="end" fill="#333">Cleaning &amp; sanitizing</text><line x1="301.4" y1="86.3" x2="411.4" y2="86.3" stroke="#bbb" stroke-width="3"/><circle cx="301.4" cy="86.3" r="5" fill="#2a9d8f"/><circle cx="411.4" cy="86.3" r="5" fill="#d1495b"/><text x="419" y="90" font-size="8" t