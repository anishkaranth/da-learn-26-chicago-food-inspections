259" y="328" font-size="9" text-anchor="middle" fill="#333">15-30 days</text><rect x="311.6" y="298.0" width="56.8" height="16.0" fill="#3d405b"/><text x="340" y="294" font-size="9" text-anchor="middle" fill="#444">3.7%</text><text x="340" y="283" font-size="8" text-anchor="middle" fill="#888">77% passed</text><text x="340" y="328" font-size="9" text-anchor="middle" fill="#333">31-90 days</text><rect x="392.7" y="306.2" width="56.8" height="7.8" fill="#3d405b"/><text x="421" y="302" font-size="9" text-anchor="middle" fill="#444">1.8%</text><text x="421" y="291" font-size="8" text-anchor="middle" fill="#888">69% passed</text><text x="421" y="328" font-size="9" text-anchor="middle" fill="#333">91-365 days</text><rect x="473.9" y="312.3" width="56.8" height="1.7" fill="#3d405b"/><text x="502" y="308" font-size="9" text-anchor="middle" fill="#444">0.4%</text><text x="502" y="297" font-size="8" text-anchor="middle" fill="#888">66% passed</text><text x="502" y="328" font-size="9" text-anchor="middle" fill="#333">over 1 year</text><rect x="555.0" y="302.7" width="56.8" height="11.3" fill="#3d405b"/><text x="583" y="299" font-size="9" text-anchor="middle" fill="#444">2.6%</text><text x="583" y="288" font-size="8" text-anchor="middle" fill="#888"></text><text x="583" y="328" font-size="9" text-anchor="middle" fill="#333">none yet / closed</text><line x1="56" y1="314" x2="624" y2="314" stroke="#999"/></svg>
